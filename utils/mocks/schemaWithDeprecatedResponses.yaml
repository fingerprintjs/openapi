openapi: 3.1.1
info:
  title: test
  version: '1.0'
paths:
  /v4/events:
    parameters:
      # Path-level parameters are not operations and should remain untouched
      - name: x-region
        in: header
        required: false
        schema:
          type: string
    get:
      operationId: searchEvents
      responses:
        '200':
          description: OK
        '500':
          description: Workspace error
        # Deprecated response should be removed
        '504':
          description: Gateway Timeout
          x-deprecated-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v4/events/{event_id}:
    get:
      operationId: getEvent
      responses:
        '200':
          description: OK
        # Responses not explicitly marked as deprecated should remain
        '500':
          description: Workspace error
          x-deprecated-response: false
        '504':
          description: Gateway Timeout
          x-deprecated-response: true
    patch:
      operationId: updateEvent
      responses:
        '200':
          description: OK
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
