type: object
description: |
  A Device Intelligence or Automation Intelligence event. Check `source` first, because it determines which properties the event can contain.

  Both sources can contain:
  - Request metadata like `event_id`, `timestamp`, `source`, `linked_id`, `environment_id`, `tags`, `url`.
  - IP and bot analysis fields like `ip_info`, `bot_info`, `proxy`, `vpn`.

  Sources:
  - `device` - generated by the Fingerprint JavaScript agent or a mobile SDK running on an end-user device. Also contains Identification (`visitor_id`) and Smart Signals derived from device telemetry. See `EventDevice`.
  - `edge` - generated by the Automation Intelligence API (`/edge` endpoint) for a request intercepted at the edge. Contains only the properties above. See `EventEdge`.
required: []
oneOf:
  - $ref: EventDevice.yaml
  - $ref: EventEdge.yaml
discriminator:
  propertyName: source
  mapping:
    device: EventDevice.yaml
    edge: EventEdge.yaml
