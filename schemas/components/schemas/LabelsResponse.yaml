type: object
description: The result of a synchronous label submission.
additionalProperties: false
required:
  - source_id
  - source_type
  - event_id
  - status
properties:
  source_id:
    type: string
    description: The ID of this submission.
    examples:
      - 1786370416667.4gsLK5
  source_type:
    type: string
    description: The type of this submission.
    examples:
      - server_api
  event_id:
    type: string
    description: The event ID that was labelled.
    examples:
      - 1735401600000.AbCdEf
  status:
    $ref: LabelsStatus.yaml
  errors:
    type: array
    description: The reasons the labels were rejected. Omitted unless `status` is `rejected`.
    items:
      $ref: LabelsEventError.yaml
